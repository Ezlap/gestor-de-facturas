<div class="d-flex min-vh-100">
<aside class="bg-dark text-white p-3" style="width: 230px">
    <h5 class="mb-4">Facturas IA</h5>
    <nav class="nav flex-column">
        <a class="nav-link text-white" routerLink="/dashboard" routerLinkActive="active fw-bold">Dashboard</a>
        <a class="nav-link text-white" routerLink="/cargar" routerLinkActive="active fw-bold">Cargar factura</a>
        <a class="nav-link text-white" routerLink="/facturas" routerLinkActive="active fw-bold">Facturas</a>
    </nav>
</aside>

<main class="flex-grow-1 bg-light p-4">
    <router-outlet />
</main>
</div>

@if (notificaciones.mensaje(); as m) {
<div
    class="alert toast-box"
    [class.alert-success]="m.tipo === 'ok'"
    [class.alert-danger]="m.tipo === 'error'"
    role="alert"
>
    {{ m.texto }}
</div>
}
